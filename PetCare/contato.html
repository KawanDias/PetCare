<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contato | PetCare</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="bg"></div>
  <div class="blur"></div>

  <header>

    <div class="logo">
      Pet<span>Care</span>
    </div>

    <nav>
      <a href="index.html">Início</a>
      <a href="servicos.html">Serviços</a>
      <a href="adocao.html">Adoção</a>
      <a href="contato.html">Contato</a>
      <div class="nav-auth" id="navAuth">
        <button class="nav-link" onclick="openAuthModal('login')">🔐 Login</button>
        <button class="nav-link" onclick="openAuthModal('register')">✍️ Cadastro</button>
      </div>
    </nav>

  </header>

  <!-- MODAL DE AUTENTICAÇÃO -->
  <div id="authModal" class="auth-modal">
    <div class="auth-modal-content">
      <button class="modal-close" onclick="closeAuthModal()">✕</button>

      <div class="auth-header">
        <h2 id="modalTitle">Entrar</h2>
        <p id="modalSubtitle">Acesse sua conta para continuar</p>
      </div>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <!-- FORMULÁRIO DE LOGIN -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>

        <button type="submit" class="primary" style="width: 100%; margin-top: 8px;">Entrar</button>
      </form>

      <!-- FORMULÁRIO DE CADASTRO -->
      <form id="registerForm" class="auth-form hidden-form">
        <div class="form-group">
          <label for="registerName">Nome Completo</label>
          <input type="text" id="registerName" placeholder="Seu nome aqui" required>
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label for="registerPassword">Senha</label>
          <input type="password" id="registerPassword" placeholder="••••••••" required minlength="6">
        </div>

        <div class="form-group">
          <label for="registerPasswordConfirm">Confirmar Senha</label>
          <input type="password" id="registerPasswordConfirm" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" class="primary" style="width: 100%; margin-top: 8px;">Criar Conta</button>
      </form>

      <!-- TOGGLE ENTRE LOGIN E CADASTRO -->
      <div class="auth-toggle">
        <span id="toggleText">Não tem conta? <a onclick="toggleAuthForms()">Cadastre-se</a></span>
      </div>

    </div>
  </div>

  <section class="page">

    <h1 class="page-title">
      Entre em <span>Contato</span>
    </h1>

    <p class="page-description">
      Fale com nossa equipe para dúvidas, suporte ou sugestões.
    </p>

    <form class="contact-form" id="contactForm">

      <input type="text" name="name" placeholder="Seu nome" required>

      <input type="email" name="email" placeholder="Seu e-mail" required>

      <input type="text" name="subject" placeholder="Assunto" required>

      <textarea name="message" placeholder="Digite sua mensagem" required></textarea>

      <button type="submit" class="primary">
        Enviar Mensagem
      </button>

    </form>

  </section>

  <footer>
    © 2026 PetCare • Desenvolvido por Kawan & Alexandre
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/index.min.js"></script>
  <script src="script.js"></script>
  <script src="contato.js"></script>

</body>

</html>
